#:schema node_modules/wrangler/config-schema.json
name = "themanagedmac-com"
compatibility_date = "2025-01-01"

# Static Astro site served directly by Cloudflare Workers' static-assets
# feature -- no worker script required for the base site.
[assets]
directory = "./dist"
not_found_handling = "404-page"

# Custom domain / route.
# After the Worker is deployed once, attach the domain in the Cloudflare
# dashboard: Workers & Pages -> themanagedmac-com -> Settings -> Domains &
# Routes -> Add -> themanagedmac.com (Cloudflare will handle the DNS record
# automatically since the zone already lives in this account).
